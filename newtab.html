<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Nouvel onglet</title>
<style>
  :root { --bg: #3a3445; --text: #e8e3ee; --muted: #a9a2b5; --card: #2f2a38; --accent: #cfbcff; }
  @media (prefers-color-scheme: light) { :root { --bg: #faf8fc; --text: #1f1b24; --muted: #5f586b; --card: #ece8f3; --accent: #5b45a6; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-weight: 500; margin: 0 0 28px; font-size: clamp(28px, 7vw, 56px); letter-spacing: -.5px; color: var(--accent); }
  form { width: min(640px, 100%); }
  input { width: 100%; height: 52px; padding: 0 24px; font-size: 16px; border-radius: 26px; border: 1px solid transparent;
    background: #fff; color: #1f1b24; outline: none; box-shadow: 0 1px 3px #0003; }
  input:focus { border-color: var(--accent); }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; width: min(640px, 100%); }
  a.card { flex: 1 1 240px; display: block; padding: 14px 18px; border-radius: 14px; background: var(--card); color: var(--text); text-decoration: none; }
  a.card:hover { outline: 1px solid var(--accent); }
  a.card b { display: block; font-size: 14px; margin-bottom: 2px; }
  a.card span { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <h1>VirtuStream</h1>
  <form action="https://www.google.com/search" method="get">
    <input name="q" placeholder="Rechercher sur Google ou saisir une adresse" autofocus autocomplete="off">
  </form>
  <div class="cards">
    <a class="card" href="test.html"><b>Tester la caméra virtuelle</b><span>Vérifie résolution, fréquence et lecture</span></a>
    <a class="card" href="https://meet.google.com/new"><b>Google Meet</b><span>Réunion de test</span></a>
  </div>
</body>
</html>
