<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src fakecam: blob: mediastream:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Aperçu de la caméra</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px "Segoe UI", system-ui, sans-serif; color: #e8e3ee; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px; background: rgba(30, 27, 36, .92);
    display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; opacity: 0; transition: opacity .15s; }
  body:hover #bar, #bar.show { opacity: 1; }
  label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  select { max-width: 230px; background: #2f2a38; color: #e8e3ee; border: 1px solid #4a4357; border-radius: 6px; padding: 3px 4px; font: inherit; }
  input[type=range] { width: 80px; }
  #msg { flex-basis: 100%; color: #e6c27a; min-height: 14px; }
  #hint { color: #a9a2b5; flex-basis: 100%; }
</style>
</head>
<body>
<video id="v" muted playsinline></video>
<div id="bar">
  <label><input type="checkbox" id="on"> Son</label>
  <label>Envoyer vers <select id="out"><option value="">(sortie par défaut)</option></select></label>
  <label><input type="checkbox" id="mon"> Retour</label>
  <input type="range" id="vol" min="0" max="1" step="0.05" title="Volume du retour">
  <span id="hint">Pour VB-Cable : choisissez « CABLE Input ». Le site utilisera « CABLE Output » comme micro.</span>
  <span id="msg"></span>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const v = $('v');
  v.loop = q.get('loop') === '1';
  let paused = q.get('paused') === '1';
  v.src = q.get('src');
  v.addEventListener('loadedmetadata', () => { if (v.videoWidth) pv.size(v.videoWidth, v.videoHeight); });
  v.addEventListener('loadeddata', () => { if (!paused) v.play().catch(() => {}); });

  pv.onCommand((cmd, arg) => {
    if (cmd === 'pause') { paused = true; v.pause(); }
    else if (cmd === 'play') { paused = false; v.play().catch(() => {}); }
    else if (cmd === 'restart') { v.currentTime = 0; }
    else if (cmd === 'loop') { v.loop = !!arg; }
    else if (cmd === 'source') { v.src = arg; if (!paused) v.play().catch(() => {}); }
    else if (cmd === 'time') {
      // Recalage progressif sur la position réelle de la vidéo envoyée (pas de saccade audio)
      const d = v.currentTime - arg;
      if (Math.abs(d) > 1) { v.currentTime = arg; v.playbackRate = 1; }
      else if (Math.abs(d) > 0.05) v.playbackRate = d > 0 ? 0.95 : 1.05;
      else v.playbackRate = 1;
    }
  });

  // ---------- Son : aperçu → sortie choisie (ex. VB-Cable) + retour dans les haut-parleurs ----------
  let ctx = null, gain = null, aOut = null, aMon = null, prefs = { enabled: false, outLabel: '', monitor: true, volume: 0.6 };
  const msg = (t) => { $('msg').textContent = t || ''; $('bar').classList.toggle('show', !!t); };
  const save = () => pv.setPrefs(prefs);

  async function fillDevices() {
    let list = await navigator.mediaDevices.enumerateDevices();
    if (list.some((d) => d.kind === 'audiooutput' && !d.label)) {
      try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach((t) => t.stop()); } catch (_) {}
      list = await navigator.mediaDevices.enumerateDevices();
    }
    const sel = $('out');
    sel.length = 1;
    list.filter((d) => d.kind === 'audiooutput' && d.deviceId !== 'default' && d.deviceId !== 'communications').forEach((d) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || 'Sortie audio'; o.dataset.label = d.label;
      sel.appendChild(o);
    });
    let pick = [...sel.options].find((o) => prefs.outLabel && o.dataset.label === prefs.outLabel);
    if (!pick && !prefs.outLabel) pick = [...sel.options].find((o) => /CABLE Input/i.test(o.dataset.label || ''));
    if (pick) { sel.value = pick.value; prefs.outLabel = pick.dataset.label; }
  }

  async function applySink() {
    if (!ctx) return;
    const id = $('out').value;
    try { await aOut.setSinkId(id || ''); msg(''); }
    catch (e) { msg('Sortie impossible : ' + e.name); }
    aMon.volume = prefs.volume;
    aMon.muted = !prefs.monitor;
    gain.gain.value = prefs.enabled ? 1 : 0;
  }

  async function ensureAudio() {
    if (ctx) return;
    await fillDevices();
    v.muted = false;                           // le son passe uniquement par le graphe audio ci-dessous
    ctx = new AudioContext();
    const src = ctx.createMediaElementSource(v);
    gain = ctx.createGain();
    const dest = ctx.createMediaStreamDestination();
    src.connect(gain); gain.connect(dest);
    aOut = new Audio(); aOut.srcObject = dest.stream;  // vers la sortie choisie (VB-Cable)
    aMon = new Audio(); aMon.srcObject = dest.stream;  // retour : sortie Windows par défaut
    aOut.play().catch(() => {}); aMon.play().catch(() => {});
    if (ctx.state === 'suspended') ctx.resume();
  }

  async function refresh() {
    $('on').checked = prefs.enabled; $('mon').checked = prefs.monitor; $('vol').value = prefs.volume;
    if (prefs.enabled) { try { await ensureAudio(); await applySink(); } catch (e) { msg('Audio indisponible : ' + e.message); } }
    else if (ctx) await applySink();
  }

  $('on').onchange = () => { prefs.enabled = $('on').checked; save(); refresh(); };
  $('mon').onchange = () => { prefs.monitor = $('mon').checked; save(); refresh(); };
  $('vol').oninput = () => { prefs.volume = Number($('vol').value); save(); if (aMon) aMon.volume = prefs.volume; };
  $('out').onchange = () => {
    const o = $('out').selectedOptions[0];
    prefs.outLabel = (o && o.dataset.label) || '';
    save(); refresh();
  };
  pv.getPrefs().then((p) => { if (p) prefs = p; refresh(); });
</script>
</body>
</html>
