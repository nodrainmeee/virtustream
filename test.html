<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Test de la caméra</title>
<style>
  :root { --bg: #3a3445; --text: #e8e3ee; --card: #2f2a38; --accent: #cfbcff; --on: #1f1b24; }
  @media (prefers-color-scheme: light) { :root { --bg: #faf8fc; --text: #1f1b24; --card: #ece8f3; --accent: #5b45a6; --on: #fff; } }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
  h1 { margin-top: 0; font-weight: 500; }
  video { width: 100%; max-width: 720px; background: #000; border-radius: 12px; display: block; margin: 16px 0; }
  button { padding: 10px 18px; font-size: 14px; border-radius: 18px; border: 0; background: var(--accent); color: var(--on); cursor: pointer; margin-right: 8px; }
  pre { background: var(--card); padding: 12px; border-radius: 10px; overflow: auto; font-size: 13px; }
</style>
</head>
<body>
  <h1>Test de la caméra virtuelle</h1>
  <p>Choisissez une vidéo (Ctrl+Maj+V), puis démarrez la caméra.</p>
  <button id="start">Démarrer la caméra</button><button id="stop">Arrêter</button>
  <video id="v" autoplay playsinline muted></video>
  <pre id="log">En attente…</pre>
<script>
  const log = (t) => { document.getElementById('log').textContent = t; };
  let stream = null, timer = null;
  const v = document.getElementById('v');
  function report() {
    if (!stream) return;
    const s = stream.getVideoTracks()[0].getSettings();
    log('Caméra OK\nRésolution reçue par la page : ' + v.videoWidth + ' × ' + v.videoHeight +
        '\nFréquence déclarée : ' + (s.frameRate || 'n/c') + ' ips');
  }
  document.getElementById('start').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      v.srcObject = stream;
      const devices = await navigator.mediaDevices.enumerateDevices();
      report();
      log(document.getElementById('log').textContent + '\n\nPériphériques :\n' +
          devices.map((d) => d.kind + ' — ' + (d.label || '(sans nom)')).join('\n'));
      clearInterval(timer);
    } catch (e) { log('Erreur : ' + e.name + ' — ' + e.message); }
  };
  document.getElementById('stop').onclick = () => {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; v.srcObject = null; log('Caméra arrêtée (la vidéo est libérée après quelques secondes).');
  };
</script>
</body>
</html>
